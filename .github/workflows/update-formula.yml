name: Update formula

on:
  schedule:
    - cron: '17 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tap
        uses: actions/checkout@v7
      - name: Update from latest release checksums
        run: python3 scripts/update_formula.py
      - name: Commit formula update
        shell: bash
        run: |
          if git diff --quiet -- Formula/udf.rb; then
            echo 'Formula is already up to date.'
            exit 0
          fi
          version=$(sed -nE 's/^  version "([^"]+)"$/\1/p' Formula/udf.rb)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/udf.rb
          git commit -m "Update udf formula to ${version}"
          git push
